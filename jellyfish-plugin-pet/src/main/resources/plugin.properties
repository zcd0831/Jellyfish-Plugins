# plugin.id 同时是注册表的 owner：插件卸载时按它批量回收订阅与面板贡献。
plugin.id=jellyfish-pet
plugin.class=zcd.jellyfish.plugin.pet.PetPlugin
plugin.version=0.0.1
plugin.provider=zcd
plugin.description=宠物：一只住在侧栏里的宠物，它的样子是这个会话工作习惯的镜像

# 内核版本号是 0.0.1-SNAPSHOT，不是合法 semver，只能写通配。
plugin.requires=*

jellyfish.tags=ui,motivation
