# Jellyfish 官方待办插件（PF4J 描述符，必须位于插件 jar 根目录）
#
# plugin.id 同时是注册表的 owner：插件卸载时按它批量回收命令、工具与提示词贡献。
plugin.id=jellyfish-plugin-todo
plugin.class=zcd.jellyfish.plugin.todo.TodoPlugin
plugin.version=0.1.0
plugin.provider=zcd
plugin.description=待办清单：模型可写的 todo_write 工具 + 只读 /todo + system prompt 注入

# 内核未向 PF4J 声明系统版本（缺省 "0.0.0" 会让这条校验直接放行），写 * 是显式声明「不限版本」。
plugin.requires=*

jellyfish.tags=todo,planning
