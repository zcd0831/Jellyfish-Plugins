# Jellyfish 官方资源监控插件（PF4J 描述符，必须位于插件 jar 根目录）
#
# plugin.id 同时是注册表的 owner：插件卸载时按它批量回收命令、候选查询与面板贡献。
plugin.id=jellyfish-plugin-resmon
plugin.class=zcd.jellyfish.plugin.resmon.ResmonPlugin
plugin.version=0.1.1
plugin.provider=zcd
plugin.description=资源监控：JVM 与磁盘占用采样，只读 /resmon 命令 + TUI 常驻面板

# 内核兼容约束刻意写 *：内核未向 PF4J 声明系统版本，缺省值 "0.0.0" 会让这条校验直接放行，
# 因此写 * 是显式声明「不限版本」，而不是一个真在生效的版本门控。
plugin.requires=*

# 标签仅作诊断与展示。
jellyfish.tags=resmon,metrics,jvm,disk,diagnostics
