# Jellyfish 官方项目约定插件（PF4J 描述符，必须位于插件 jar 根目录）
#
# plugin.id 同时是注册表的 owner：插件卸载时按它批量回收提示词贡献。
plugin.id=jellyfish-plugin-project
plugin.class=zcd.jellyfish.plugin.project.ProjectPlugin
plugin.version=0.1.1
plugin.provider=zcd
plugin.description=项目约定：探测工作目录下的 AGENTS.md，小文件内联原文、大文件给出路径指引；/init 让模型读仓库后写出它

# 内核兼容约束刻意写 *：内核未向 PF4J 声明系统版本，缺省值 "0.0.0" 会让这条校验直接放行，
# 因此写 * 是显式声明「不限版本」，而不是一个真在生效的版本门控。
plugin.requires=*

# 标签仅作诊断与展示。
jellyfish.tags=project,conventions,prompt,command
