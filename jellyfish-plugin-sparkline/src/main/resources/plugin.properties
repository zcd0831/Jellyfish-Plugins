# Jellyfish 官方火花线插件（PF4J 描述符，必须位于插件 jar 根目录）
#
# plugin.id 同时是注册表的 owner：插件卸载时按它批量回收订阅与面板贡献。
plugin.id=jellyfish-sparkline
plugin.class=zcd.jellyfish.plugin.sparkline.SparklinePlugin
plugin.version=0.0.1
plugin.provider=zcd
plugin.description=火花线：把缓存命中率、失败率与上下文规模压成一行块字符，看趋势而不是看单点

# 内核版本号是 0.0.1-SNAPSHOT，不是合法 semver，只能写通配。
plugin.requires=*

jellyfish.tags=ui,metrics,trend
