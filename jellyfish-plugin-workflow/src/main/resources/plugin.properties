# Jellyfish 官方编排插件（PF4J 描述符，必须位于插件 jar 根目录）
#
# plugin.id 同时是注册表的 owner：插件卸载时按它批量回收工具与提示词贡献。
plugin.id=jellyfish-plugin-workflow
plugin.class=zcd.jellyfish.plugin.workflow.WorkflowPlugin
plugin.version=0.1.1
plugin.provider=zcd
plugin.description=编排：一份声明式 spec 派生一批子代理，按依赖并发执行并聚合结果

# 内核未向 PF4J 声明系统版本（缺省 "0.0.0" 会让这条校验直接放行），写 * 是显式声明「不限版本」。
plugin.requires=*

jellyfish.tags=workflow,orchestration,subagent
