# Jellyfish 官方 plan 模式插件（PF4J 描述符，必须位于插件 jar 根目录）
#
# plugin.id 同时是注册表的 owner：插件卸载时按它批量回收权限拦截、命令与各项贡献。
plugin.id=jellyfish-plugin-plan
plugin.class=zcd.jellyfish.plugin.plan.PlanPlugin
plugin.version=0.1.1
plugin.provider=zcd
plugin.description=plan 模式：按用户声明的只读白名单拦截写类工具，/plan [on|off] 在会话内切换

# 内核未向 PF4J 声明系统版本（缺省 "0.0.0" 会让这条校验直接放行），写 * 是显式声明「不限版本」。
plugin.requires=*

jellyfish.tags=plan,permission,readonly
