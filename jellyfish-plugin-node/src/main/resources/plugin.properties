# Jellyfish Node 桥接插件（PF4J 描述符，必须位于插件 jar 根目录）
#
# plugin.id 同时是注册表的 owner 根：脚本级注册形如 {plugin.id}::{scriptId}，
# 卸载 / 停止时由 PluginContextFactory.release 按命名空间一次性回收（见 owner 命名空间契约）。
plugin.id=jellyfish-plugin-node
plugin.class=zcd.jellyfish.plugin.node.NodeBridgePlugin
plugin.version=0.1.1
plugin.provider=zcd
plugin.description=Node 桥接插件：以标准 PF4J 插件的形态承载 Node 脚本插件（单脚本一 worker 进程）

# 内核未向 PF4J 声明系统版本（缺省 "0.0.0" 会让这条校验直接放行），写 * 是显式声明「不限版本」。
plugin.requires=*

jellyfish.tags=script,node
